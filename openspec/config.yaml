schema: spec-driven

context: |
  Tech stack: TypeScript, React 19, Vite, Express 5, Node.js >=18
  Database: Supabase (PostgreSQL) with pgvector, Redis (ioredis)
  AI/ML: Google Gemini API, Groq, semantic search, embeddings
  Styling: Tailwind CSS 3.4, PostCSS, Lucide React
  Testing: Vitest 4 with jsdom, @testing-library/react
  Architecture: Fluid ontology — structured clause extraction, semantic coverage mapping, triple-source chat, hybrid RAG (vector + BM25)
  Domain: Insurance comparison platform (PYME) for Colombian market
  Deployment: Railway (frontend + backend), Supabase for data
  Conventions: Conventional commits, feature branch workflow, husky + lint-staged (tsc --noEmit)

projects:
  - path: .
    stack: TypeScript, React 19, Express 5, Vite, Vitest
    test: npm test
    framework: vitest
    layers:
      unit: true
      integration: true
      e2e: false
    coverage: npm run coverage
    quality:
      linter: npm run lint
      typecheck: npm run typecheck:frontend && npm run typecheck:backend
      formatter: npm run format:check

rules:
  proposal:
    - Include rollback plan for risky changes
    - Document feature flag configuration when applicable
  specs:
    - Use Given/When/Then for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
    - Cover both happy path and edge cases (empty PDFs, malformed clauses)
  design:
    - Include sequence diagrams for complex LLM flows
    - Document architecture decisions with rationale
    - Reference existing fluid ontology services
  tasks:
    - Group by phase, use hierarchical numbering
    - Keep tasks completable in one session
    - Mark feature flag toggles in task descriptions
  apply:
    - Follow existing code patterns in server/src/services/
    - Maintain strict TypeScript typing
  verify:
    - Run npm test to verify all tests pass
    - Run npm run build to check for TypeScript/build errors
  archive:
    - Warn before merging destructive deltas
    - Preserve feature flag backward compatibility

testing:
  strict_tdd: false
  runner: vitest
  command: npm test
  environment: jsdom
  coverage: true
  layers:
    unit: true
    integration: true
    e2e: false
